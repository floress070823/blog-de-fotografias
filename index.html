<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Fotografías</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            background-image: linear-gradient(rgba(11, 15, 25, 0.88), rgba(11, 15, 25, 0.88)), url('img/fondo.jpeg');
            background-attachment: fixed;
            background-size: cover;
            color: #ffffff;
        }
        .portada {
            background-image: linear-gradient(
                to bottom,
                rgba(11, 15, 25, 0.3) 0%,
                rgba(11, 15, 25, 0.7) 70%,
                rgba(11, 15, 25, 1) 100%
            ), url('img/portada.jpeg');
            
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            
            width: 100%;
            min-height: 70vh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center; 
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .portada h1 {
            font-family: 'Playfair Display', serif; 
            font-size: 4rem;
            margin: 0;
            line-height: 1.1;
            font-weight: 600;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .portada .subtitulo {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #d1d5db;
            margin-top: 15px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .equipo {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #9ca3af;
            font-weight: 300;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        /* SECCIÓN DE CATEGORÍAS */
        .categorias-seccion {
            padding: 50px 20px 80px 20px;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .categorias-seccion h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .grid-categorias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .tarjeta-link {
            text-decoration: none;
            color: inherit;
        }

        .tarjeta {
            background-color: #131a29;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #232d42;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .tarjeta:hover {
            transform: translateY(-8px);
            border-color: #3b82f6;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .tarjeta img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background-color: #090d15;
            display: block;
            padding: 15px;
            box-sizing: border-box;
        }

        .tarjeta-info {
            padding: 20px;
            background-color: #131a29;
        }

        .tarjeta-info h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 8px 0;
            font-size: 1.4rem;
        }

        .tarjeta-info p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin: 0;
        }

    </style>
</head>
<body>
    <header class="portada">
        <h1>Capture The Moments</h1>
        <p class="subtitulo">EXPOSICIÓN FOTOGRÁFICA</p>
        <div class="equipo">
            Gisselle Elizabeth Flores Vásquez | Kevin Anderson Aguilar Vilanova | Keilor Abigan Cañenguez Marín
        </div>
    </header>
    <section class="categorias-seccion">
        <h2>Tipos de Capturas</h2>
        
        <div class="grid-categorias">
            <a href="Producto&modelo.html" class="tarjeta-link">
                <div class="tarjeta">
                    <img src="img/copa1.jpeg" alt="Retratos">
                    <div class="tarjeta-info">
                        <h3>Producto y modelo</h3>
                    </div>
                </div>
            </a>
            <a href="Alimento y bebida.html" class="tarjeta-link">
                <div class="tarjeta">
                    <img src="img/creep.jpeg" alt="Gastronomía">
                    <div class="tarjeta-info">
                        <h3>Alimento y bebida</h3>
                    </div>
                </div>
            </a>
            <a href="producto.html" class="tarjeta-link">
                <div class="tarjeta">
                    <img src="img/perfume.jpeg" alt="Producto">
                    <div class="tarjeta-info">
                        <h3>Producto</h3>
                    </div>
                </div>
            </a>
        </div>
    </section>

</body>
</html>

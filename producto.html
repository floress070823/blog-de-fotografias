<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Galería</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #111; color: #fff; margin: 0; padding: 40px 20px; }
        .contenedor { max-width: 1000px; margin: 0 auto; }
        .boton-volver { display: inline-block; color: #aaa; text-decoration: none; margin-bottom: 20px; }
        .boton-volver:hover { color: #fff; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 10px; }
        p.intro { color: #888; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .item { background: #1a1a1a; border-radius: 10px; overflow: hidden; border: 1px solid #2a2a2a; }
        .item img { width: 100%; height: 350px; object-fit: cover; display: block; }
        .item-texto { padding: 20px; }
        .item-texto h3 { margin: 0 0 10px 0; font-family: 'Playfair Display', serif; }
        .item-texto p { color: #aaa; font-size: 0.9rem; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="contenedor">
        <a href="index.html" class="boton-volver">← Volver al Inicio</a>
        <h1>Producto & Efectos</h1>
        <p class="intro">descripción.</p>

        <div class="grid">
            <div class="item">
                <img src="img/perfume.jpeg" alt="Perfume">
                <div class="item-texto">
                    <h3>Fotografía 1: Perfume</h3>
                    <p>[concepto]</p>
                </div>
            </div>

            <div class="item">
                <img src="img/spray.jpeg" alt="Spray">
                <div class="item-texto">
                    <h3>Fotografía 2: Efectos de Humo/Spray</h3>
                    <p>[concepto]</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
